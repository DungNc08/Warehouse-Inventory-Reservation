services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: ./database
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/warehouse
      LIQUIBASE_COMMAND_USERNAME: warehouse
      LIQUIBASE_COMMAND_PASSWORD: warehouse
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: changelog
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/warehouse
      SPRING_DATASOURCE_USERNAME: warehouse
      SPRING_DATASOURCE_PASSWORD: warehouse
    depends_on:
      migration:
        condition: service_completed_successfully
